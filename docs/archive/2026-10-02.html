<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Daily Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#0F1729;--pan:#182236;--pan2:#22304C;--line:#2E3D5C;
      --ink:#F2F5FA;--dim:#A8B4CA;--dim2:#7C8BA8;--warm:#FAC775;--warmbg:#2A2010}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;
     -webkit-font-smoothing:antialiased}
h1,h2,h3,.dis{font-family:'Baloo 2',Nunito,sans-serif;font-weight:600}
.app{display:flex;min-height:100vh;max-width:1240px;margin:0 auto}

.side{flex:0 0 196px;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{font-family:'Baloo 2';font-size:22px;line-height:1.1}
.tag{color:var(--dim2);font-size:11px;margin:2px 0 18px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;
    color:var(--dim);text-decoration:none;font-size:14px;font-weight:600;margin-bottom:3px;
    border:2px solid transparent;cursor:pointer;background:none;width:100%;
    font-family:inherit;text-align:left}
.nv i{font-size:18px}
.nv:hover{background:var(--pan)}
.nv.on{background:var(--nvbg,#5DCAA5);color:var(--nvfg,#04342C);border-color:var(--nvbd,#1D9E75)}
.nvn{margin-left:auto;font-size:11px;opacity:.75}
.hr{height:2px;background:var(--line);margin:12px 0;border-radius:2px}

.main{flex:1;min-width:0;padding:20px 18px 60px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
     flex-wrap:wrap;margin-bottom:18px}
.hey{font-size:26px;line-height:1.15}
.sub{color:var(--dim2);font-size:13px;margin-top:2px}
.meta{text-align:right;font-size:12px;color:var(--dim)}
.meta b{display:block;font-weight:600}
.pills{display:flex;gap:7px;margin-top:7px;justify-content:flex-end;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;
      font-size:11px;font-weight:700;border:2px solid var(--line);background:var(--pan);color:var(--dim)}
.pill.fire{background:var(--warmbg);border-color:#EF9F27;color:var(--warm)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{border-radius:18px;padding:15px 16px 14px;text-decoration:none;display:block;
      border:4px solid transparent;cursor:pointer;font-family:inherit;text-align:left;width:100%}
.tile i.hd{font-size:28px}
.tile .nm{font-family:'Baloo 2';font-size:17px;margin-top:7px}
.tile .bl{font-size:12px;margin-top:1px;font-weight:600}
.tile .rw{display:flex;align-items:center;justify-content:space-between;margin-top:12px;
          font-size:12px;font-weight:700}

.panel{background:var(--pan);border:3px solid var(--line);border-radius:18px;
       padding:14px 16px;margin-top:14px}
.ph{display:flex;align-items:center;gap:7px;font-family:'Baloo 2';font-size:16px;margin-bottom:11px}
.trow{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 18px}
.tr{display:flex;gap:9px;align-items:baseline;text-decoration:none}
.trn{flex:0 0 20px;height:20px;border-radius:50%;background:var(--pan2);color:var(--warm);
     font-size:11px;font-weight:700;display:grid;place-items:center}
.trt{font-size:13px;color:var(--ink);line-height:1.4;font-weight:600}
.trs{color:var(--dim2);font-weight:400;font-size:12px}

.deck{position:relative;height:min(70vh,470px);margin-top:6px}
.bk{position:absolute;border-radius:20px;background:var(--pan);border:3px solid var(--line)}
.bk.b1{left:2.5%;right:2.5%;top:9px;bottom:-6px}
.bk.b2{left:5%;right:5%;top:18px;bottom:-12px}
.card{position:absolute;inset:0;border-radius:20px;overflow:hidden;display:flex;
      cursor:grab;user-select:none;border-width:4px;border-style:solid}
.card.go{transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s}
.cmain{flex:1;min-width:0;padding:17px 18px;display:flex;flex-direction:column;position:relative}
.crow{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.bdg{font-size:12px;font-weight:700;padding:4px 13px;border-radius:99px;border:2px solid}
.tmm{font-size:12px;font-weight:600}
.statb{display:inline-flex;align-items:baseline;gap:9px;align-self:flex-start;
       padding:7px 14px;border-radius:14px;border:3px solid;margin-bottom:10px}
.statv{font-family:'Baloo 2';font-size:clamp(22px,5vw,30px);line-height:1}
.statl{font-size:12px;font-weight:600}
.ttl{font-family:'Baloo 2';font-size:clamp(17px,3.4vw,23px);line-height:1.25;margin-bottom:8px}
.sm{font-size:14px;line-height:1.6;margin:0;flex:1;overflow-y:auto;font-weight:400}
.cfoot{display:flex;align-items:center;gap:9px;padding-top:12px;margin-top:9px;
       border-top:3px solid;flex-wrap:wrap}
.srcn{font-size:13px;font-weight:700}
.btn{font-family:inherit;font-size:12px;font-weight:700;padding:7px 14px;border-radius:99px;
     border:3px solid;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
     text-decoration:none;background:none}
.cside{flex:0 0 168px;padding:17px 14px;display:flex;flex-direction:column;border-left:4px solid}
.sideh{font-size:11px;font-weight:700;margin-bottom:9px}
.och{font-size:12px;font-weight:600;line-height:1.3;padding:5px 10px;border-radius:9px;
     border:2px solid;margin-bottom:6px}
.thr{margin-top:auto;font-size:11px;font-weight:700;line-height:1.35;padding:7px 11px;
     border-radius:11px;border:3px solid}
.ov{position:absolute;top:16px;opacity:0;font-size:13px;font-weight:700;padding:6px 16px;
    border-radius:99px;border:3px solid;pointer-events:none}
.ov.s{right:16px}
.ov.k{left:16px;background:var(--bg);color:var(--dim);border-color:#3A4763}

.ctrl{display:flex;align-items:center;gap:12px;margin-top:22px}
.rnd{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
     border:3px solid var(--line);background:var(--pan);color:var(--dim);font-size:19px}
.rnd:hover{border-color:var(--dim2)}
.rnd:disabled{opacity:.35;cursor:default}
.bar{height:7px;border-radius:99px;background:var(--pan2);border:2px solid var(--line);overflow:hidden}
.fil{height:100%;transition:width .25s}
.hint{text-align:center;color:var(--dim2);font-size:11px;margin-top:7px;font-weight:600}

.lst{display:flex;flex-direction:column;gap:9px}
.li{display:flex;gap:12px;align-items:flex-start;background:var(--pan);border:3px solid var(--line);
    border-radius:15px;padding:12px 14px;text-decoration:none}
.li:hover{border-color:var(--dim2)}
.lidot{flex:0 0 12px;height:12px;border-radius:50%;margin-top:4px}
.lit{font-size:14px;font-weight:600;color:var(--ink);line-height:1.35}
.lis{font-size:12px;color:var(--dim2);margin-top:3px}
.rm{margin-left:auto;flex:0 0 auto;background:none;border:none;color:var(--dim2);
    cursor:pointer;font-size:17px;padding:2px}

.qw{max-width:520px}
.qcard{background:var(--pan);border:3px solid var(--line);border-radius:18px;padding:18px}
.qq{font-family:'Baloo 2';font-size:19px;line-height:1.35;margin:8px 0 15px}
.op{display:block;width:100%;text-align:left;font-family:inherit;font-size:14px;font-weight:600;
    padding:13px 15px;border-radius:13px;border:3px solid var(--line);background:var(--pan2);
    color:var(--ink);cursor:pointer;margin-bottom:8px}
.op:hover:not(:disabled){border-color:var(--dim2)}
.op.ok{background:#0F3D2E;border-color:#1D9E75;color:#9FE1CB}
.op.no{background:#3D1616;border-color:#E24B4A;color:#F7C1C1}
.qfb{font-size:13px;line-height:1.5;margin-top:12px;padding:11px 13px;border-radius:12px;
     border:3px solid var(--line);background:var(--pan2);color:var(--dim)}
.big{text-align:center;padding:36px 20px}
.big i{font-size:52px}
.big h2{font-size:24px;margin:10px 0 5px}
.big p{color:var(--dim2);font-size:14px;margin:0 auto;max-width:36ch;line-height:1.55}

.arch{background:var(--warmbg);border:3px solid #EF9F27;color:var(--warm);border-radius:14px;
      padding:9px 14px;font-size:13px;font-weight:700;margin-bottom:14px;
      display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.arch a{color:var(--warm);margin-left:auto}
.hide{display:none!important}
a{color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--warm);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

@media(max-width:860px){
  .app{flex-direction:column}
  .side{position:static;height:auto;flex:none;padding:14px 12px 0;
        display:flex;gap:6px;overflow-x:auto}
  .logo,.tag,.hr{display:none}
  .nv{width:auto;flex:0 0 auto;padding:8px 13px;margin:0;font-size:13px}
  .nvn{display:none}
  .main{padding:16px 14px 46px}
  .cside{display:none}
  .meta{text-align:left}
  .pills{justify-content:flex-start}
  .deck{height:min(74vh,520px)}
}
</style>
</head>

  <nav class="side" id="nav"></nav>

    <div id="view"></div>
  </main>

function touchStreak(){
  const t = new Date().toISOString().slice(0, 10);
  let s = LS.get("streak", {last: "", n: 0});
  if (s.last === t) return s.n;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  s = {last: t, n: s.last === y ? s.n + 1 : 1};
  LS.set("streak", s);
  return s.n;
}

  const g = el("div", "grid");
  D.secs.forEach(s => {
    const [pale, tint, dk, md, vv] = s.c;
    const b = el("button", "tile");
    b.style.background = tint; b.style.borderColor = vv;
    b.innerHTML =
      '<i class="ti ti-' + s.icon + ' hd" style="color:' + dk + '" aria-hidden="true"></i>' +
      '<div class="nm" style="color:' + dk + '">' + esc(s.name) + '</div>' +
      '<div class="bl" style="color:' + md + '">' + esc(s.blurb) + '</div>' +
      '<div class="rw" style="color:' + md + '">' + s.n + ' nayi' +
      '<i class="ti ti-arrow-right" style="font-size:18px;color:' + dk + '" aria-hidden="true"></i></div>';
    b.onclick = () => go("sec", s.name);
    g.appendChild(b);
  });
  v.appendChild(g);

  if (D.trend.length){
    const p = el("div", "panel");
    p.innerHTML = '<div class="ph"><i class="ti ti-flame" style="color:#EF9F27" aria-hidden="true"></i>' +
                  'Aaj sabse zyada charcha mein</div>';
    const r = el("div", "trow");
    D.trend.forEach((t, i) => {
      const a = el("a", "tr");
      a.href = t.u; a.target = "_blank"; a.rel = "noopener";
      a.innerHTML = '<span class="trn">' + (i + 1) + '</span>' +
        '<span class="trt">' + esc(t.t) +
        ' <span class="trs">' + t.n + ' sources</span></span>';
      r.appendChild(a);
    });
    p.appendChild(r); v.appendChild(p);
  }
}

let deck = [], idx = 0;

function viewSec(name){
  const v = $("#view"); v.innerHTML = "";
  const s = SEC[name] || {};
  v.appendChild(header(name, (s.blurb || "") + " · " + (s.n || 0) + " stories"));

  deck = D.cards.filter(c => c.sec === name);
  const fresh = deck.filter(c => !seen.has(c.u));
  if (fresh.length) deck = fresh.concat(deck.filter(c => seen.has(c.u)));
  idx = 0;

  const wrap = el("div");
  wrap.innerHTML =
    '<div class="deck" id="deck"><div class="bk b2"></div><div class="bk b1"></div></div>' +
    '<div class="ctrl">' +
      '<button class="rnd" id="prev" aria-label="Pichhla"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>' +
      '<div style="flex:1"><div class="bar"><div class="fil" id="fil"></div></div>' +
      '<div class="hint"><span id="pos">0</span> / <span id="tot">0</span> · dayein save, bayein skip</div></div>' +
      '<button class="rnd" id="next" aria-label="Agla"><i class="ti ti-bookmark" aria-hidden="true"></i></button>' +
    '</div>';
  v.appendChild(wrap);
  $("#tot").textContent = deck.length;
  $("#prev").onclick = () => step(-1);
  $("#next").onclick = () => { const c = $("#deck .card"); c ? fly(c, 1) : step(1); };
  drawCard();
}

function drawCard(){
  const d = $("#deck");
  if (!d) return;
  d.querySelectorAll(".card,.done").forEach(n => n.remove());

  if (idx >= deck.length){
    const done = el("div", "done big");
    done.style.cssText = "position:absolute;inset:0;display:grid;place-content:center;text-align:center";
    done.innerHTML = '<i class="ti ti-confetti" style="color:#FAC775" aria-hidden="true"></i>' +
      '<h2>Ho gaya</h2><p>' + deck.length + ' stories dekh li. Quiz de do, streak pakki ho jayegi.</p>';
    const b = el("button", "btn");
    b.style.cssText = "margin:16px auto 0;border-color:#D4537E;color:#F4C0D1";
    b.textContent = "Quiz kholo"; b.onclick = () => go("quiz");
    done.appendChild(b); d.appendChild(done);
    $("#pos").textContent = deck.length;
    $("#fil").style.width = "100%";
    $("#next").disabled = true; $("#prev").disabled = idx === 0;
    return;
  }

  const c = deck[idx];
  const [pale, tint, dk, md, vv] = col(c.sec);
  const a = el("article", "card");
  a.style.background = pale; a.style.borderColor = vv;
  a.innerHTML =
    '<div class="cmain">' +
      '<div class="crow">' +
        '<span class="bdg" style="background:' + vv + ';color:' + pale + ';border-color:' + dk + '">' + esc(c.sec) + '</span>' +
        '<span class="tmm" style="color:' + md + '">' + esc(c.m) + '</span>' +
      '</div>' +
      (c.n ? '<div class="statb" style="background:' + tint + ';border-color:' + vv + '">' +
        '<span class="statv" style="color:' + dk + '">' + esc(c.n) + '</span>' +
        '<span class="statl" style="color:' + md + '">' + esc(c.nl) + '</span></div>' : '') +
      '<div class="ttl" style="color:' + dk + '">' + esc(c.t) + '</div>' +
      '<p class="sm" style="color:' + md + '">' + esc(c.p) + '</p>' +
      '<div class="cfoot" style="border-top-color:' + tint + '">' +
        '<span class="srcn" style="color:' + dk + '">' + esc(c.s) + '</span>' +
        '<button class="btn spk" style="margin-left:auto;border-color:' + vv + ';color:' + md + '">' +
          '<i class="ti ti-volume" aria-hidden="true"></i>Suno</button>' +
        '<a class="btn" href="' + esc(c.u) + '" target="_blank" rel="noopener" ' +
          'style="background:' + vv + ';color:' + pale + ';border-color:' + dk + '">Padho</a>' +
      '</div>' +
    '</div>' +
    '<div class="cside" style="background:' + tint + ';border-left-color:' + vv + '">' +
      (c.big ? '<span class="bdg" style="align-self:flex-start;margin-bottom:11px;font-size:11px;background:' +
        vv + ';color:' + pale + ';border-color:' + dk + '">Badi khabar</span>' : '') +
      (c.o.length ? '<div class="sideh" style="color:' + md + '">Aur kahan chhapa</div>' +
        c.o.map(o => '<div class="och" style="color:' + dk + ';background:' + pale +
                     ';border-color:' + pale + '">' + esc(o) + '</div>').join("") : '') +
      (c.th ? '<div class="thr" style="background:' + pale + ';border-color:' + vv +
              ';color:' + md + '">' + esc(c.th) + '</div>' : '') +
    '</div>' +
    '<span class="ov s" style="background:' + vv + ';color:' + pale + ';border-color:' + dk + '">Saved</span>' +
    '<span class="ov k">Skip</span>';
  d.appendChild(a);

  a.querySelector(".spk").onclick = e => {
    e.stopPropagation();
    try { speechSynthesis.cancel();
          speechSynthesis.speak(new SpeechSynthesisUtterance(c.t + ". " + c.p)); } catch {}
  };

  $("#pos").textContent = idx + 1;
  $("#fil").style.width = (idx / deck.length * 100) + "%";
  $("#fil").style.background = vv;
  $("#next").disabled = false; $("#prev").disabled = idx === 0;
  swipe(a);
}

function step(n){
  idx = Math.max(0, Math.min(deck.length, idx + n));
  drawCard();
}

function fly(node, dir){
  const c = deck[idx];
  if (c){
    seen.add(c.u); LS.set("seen", [...seen].slice(-1500));
    if (dir > 0 && !saved.some(x => x.u === c.u)){
      saved.unshift({u: c.u, t: c.t, s: c.s, sec: c.sec});
      LS.set("saved", saved.slice(0, 300));
    }
  }
  node.classList.add("go");
  node.style.transform = "translateX(" + (dir * 130) + "%) rotate(" + (dir * 8) + "deg)";
  node.style.opacity = "0";
  setTimeout(() => { idx++; drawCard(); nav(); }, 280);
}

function swipe(node){
  let x0 = null, y0 = 0, dx = 0, on = false;
  const s = node.querySelector(".ov.s"), k = node.querySelector(".ov.k");
  node.addEventListener("pointerdown", e => {
    if (e.target.closest("a,button")) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; on = false;
    node.style.transition = "none";
    try { node.setPointerCapture(e.pointerId); } catch {}
  });
  node.addEventListener("pointermove", e => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    if (!on && Math.abs(dx) < Math.abs(e.clientY - y0)) return;
    on = true;
    node.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 28) + "deg)";
    s.style.opacity = Math.max(0, Math.min(1, dx / 85));
    k.style.opacity = Math.max(0, Math.min(1, -dx / 85));
  });
  const up = () => {
    if (x0 === null) return;
    if (on && Math.abs(dx) > 76) fly(node, dx > 0 ? 1 : -1);
    else {
      node.style.transition = "transform .2s,opacity .2s";
      node.style.transform = ""; s.style.opacity = 0; k.style.opacity = 0;
    }
    x0 = null; dx = 0;
  };
  node.addEventListener("pointerup", up);
  node.addEventListener("pointercancel", up);
}

function viewSaved(){
  const v = $("#view"); v.innerHTML = "";
  v.appendChild(header("Saved", saved.length + " stories rakhi hain"));
  if (!saved.length){
    const b = el("div", "big");
    b.innerHTML = '<i class="ti ti-bookmark" style="color:#7F77DD" aria-hidden="true"></i>' +
      '<h2>Abhi khaali hai</h2><p>Card ko dayein swipe karo, wo yahan aa jayegi.</p>';
    v.appendChild(b); return;
  }
  const l = el("div", "lst");
  saved.forEach((c, i) => {
    const [pale, tint, dk, md, vv] = col(c.sec);
    const row = el("div", "li");
    row.innerHTML = '<span class="lidot" style="background:' + vv + '"></span>' +
      '<a href="' + esc(c.u) + '" target="_blank" rel="noopener" style="text-decoration:none;flex:1">' +
      '<div class="lit">' + esc(c.t) + '</div>' +
      '<div class="lis">' + esc(c.s) + ' · ' + esc(c.sec) + '</div></a>' +
      '<button class="rm" aria-label="Hatao"><i class="ti ti-x" aria-hidden="true"></i></button>';
    row.querySelector(".rm").onclick = () => {
      saved.splice(i, 1); LS.set("saved", saved); viewSaved(); nav();
    };
    l.appendChild(row);
  });
  v.appendChild(l);
}

async function viewOld(){
  const v = $("#view"); v.innerHTML = "";
  v.appendChild(header("Purani news", "Kisi bhi din pe tap karo"));
  const l = el("div", "lst"); l.innerHTML = '<div class="lis">Loading…</div>';
  v.appendChild(l);
  const base = ARCHIVED ? "./" : "./archive/";
  try {
    const r = await fetch(base + "dates.json", {cache: "no-store"});
    const list = await r.json();
    l.innerHTML = "";
    if (!list.length){ l.innerHTML = '<div class="lis">Abhi koi purana din nahi hai.</div>'; return; }
    const today = new Date(); today.setHours(0, 0, 0, 0);
    list.forEach(d => {
      const dt = new Date(d + "T00:00:00");
      const n = Math.round((today - dt) / 864e5);
      const rel = n === 0 ? "Aaj" : n === 1 ? "Kal" : n + " din pehle";
      const a = el("a", "li");
      a.href = (ARCHIVED ? "./" : "./archive/") + d + ".html";
      a.innerHTML = '<span class="lidot" style="background:#EF9F27"></span>' +
        '<div style="flex:1"><div class="lit">' +
        dt.toLocaleDateString("en-IN", {weekday: "long", day: "numeric", month: "long"}) +
        '</div><div class="lis">' + rel + '</div></div>' +
        '<i class="ti ti-chevron-right" style="color:#7C8BA8;font-size:18px" aria-hidden="true"></i>';
      l.appendChild(a);
    });
  } catch {
    l.innerHTML = '<div class="lis">Archive abhi nahi bana. Kal se dikhega.</div>';
  }
}

let qi = 0, qScore = 0;

function viewQuiz(){
  const v = $("#view"); v.innerHTML = "";
  v.appendChild(header("Quiz", "Aaj ki news se " + D.quiz.length + " sawaal"));
  if (!D.quiz.length){
    const b = el("div", "big");
    b.innerHTML = '<i class="ti ti-help-circle" style="color:#D4537E" aria-hidden="true"></i>' +
      '<h2>Aaj quiz nahi bana</h2><p>Kaafi headlines mein number nahi mile. Kal phir dekho.</p>';
    v.appendChild(b); return;
  }
  const w = el("div", "qw"); w.id = "qw"; v.appendChild(w);
  qi = 0; qScore = 0; drawQ();
}

function drawQ(){
  const w = $("#qw"); if (!w) return;
  if (qi >= D.quiz.length){
    const pct = Math.round(qScore / D.quiz.length * 100);
    LS.set("quizday", DATE);
    w.innerHTML = '<div class="big"><i class="ti ti-flame" style="color:#FAC775" aria-hidden="true"></i>' +
      '<h2>' + qScore + ' / ' + D.quiz.length + ' sahi</h2>' +
      '<p>' + pct + '% score. Streak ' + streak + ' din ki ho gayi.</p></div>';
    const b = el("button", "btn");
    b.style.cssText = "margin:0 auto;display:flex;border-color:#1D9E75;color:#9FE1CB";
    b.textContent = "Phir se"; b.onclick = () => { qi = 0; qScore = 0; drawQ(); };
    w.appendChild(b);
    return;
  }
  const q = D.quiz[qi];
  const opts = q.opts.slice().sort(() => Math.random() - 0.5);
  w.innerHTML = '<div class="qcard"><div class="lis">Sawaal ' + (qi + 1) + ' / ' + D.quiz.length + '</div>' +
    '<div class="qq">' + esc(q.q) + '</div><div id="ops"></div><div id="fb" class="qfb hide"></div></div>';
  const box = w.querySelector("#ops");
  opts.forEach(o => {
    const b = el("button", "op");
    b.textContent = o;
    b.onclick = () => {
      const right = o === q.a;
      if (right) qScore++;
      box.querySelectorAll(".op").forEach(x => {
        x.disabled = true;
        if (x.textContent === q.a) x.classList.add("ok");
        else if (x === b) x.classList.add("no");
      });
      const fb = w.querySelector("#fb");
      fb.classList.remove("hide");
      fb.textContent = (right ? "Sahi. " : "Sahi jawab " + q.a + ". ") + q.why;
      const nx = el("button", "btn");
      nx.style.cssText = "margin-top:12px;border-color:#7F77DD;color:#CECBF6";
      nx.textContent = qi + 1 < D.quiz.length ? "Agla sawaal" : "Score dekho";
      nx.onclick = () => { qi++; drawQ(); };
      fb.appendChild(el("div")).appendChild(nx);
    };
    box.appendChild(b);
  });
}

function go(v, sec){
  route = {v: v, sec: sec || null};
  nav();
  window.scrollTo(0, 0);
  if (v === "home") viewHome();
  else if (v === "sec") viewSec(sec);
  else if (v === "saved") viewSaved();
  else if (v === "old") viewOld();
  else if (v === "quiz") viewQuiz();
}

addEventListener("keydown", e => {
  if (route.v !== "sec") return;
  const c = $("#deck .card"); if (!c) return;
  if (e.key === "ArrowRight"){ e.preventDefault(); fly(c, 1); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); step(-1); }
});

if (ARCHIVED){
  $("#archbar").className = "arch";
  $("#archbar").innerHTML = '<i class="ti ti-calendar" aria-hidden="true"></i>Purani news · ' +
    ARCHIVED + '<a href="../index.html">Aaj ki news dekho</a>';
}
go("home");
</script>
